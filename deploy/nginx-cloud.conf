# Include inside the existing HTTPS server block. Keep its certificates/root.
location ^~ /api/cloud/ {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 100s;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
}

location = /cloud.html {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://wxpusher.zjiecode.com; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
